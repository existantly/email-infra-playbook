- name: Full Nginx SSL Bootstrap and Deploy
  hosts: all
  become: yes
  vars:
    target_domain: "{{ domain | default('') }}"
    redirect_to: "{{ redirect_url | default('https://google.com') }}"
    html_source: "https://raw.githubusercontent.com/existantly/email-infra-playbook/refs/heads/main/index.html"
    nginx_source: "https://raw.githubusercontent.com/existantly/email-infra-playbook/refs/heads/main/vhost.conf"

  tasks:
    - name: Pre-check | Ensure domain variable is set
      fail:
        msg: "Run with: -e 'domain=example.com redirect_url=https://target.com'"
      when: target_domain == ""

    - name: System | Install Nginx and Certbot
      apt:
        name: [nginx, certbot, python3-certbot-nginx]
        state: present
        update_cache: yes

    - name: System | Remove default Nginx site
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/default
        - /etc/nginx/sites-available/default

    - name: System | Open Ports 80 and 443
      ufw:
        rule: allow
        name: 'Nginx Full'

    - name: Web | Create document root
      file:
        path: "/var/www/{{ target_domain }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Web | Download HTML from GitHub
      get_url:
        url: "{{ html_source }}"
        dest: "/var/www/{{ target_domain }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Web | Inject Redirect URL into HTML
      replace:
        path: "/var/www/{{ target_domain }}/index.html"
        regexp: 'DESTINATION_URL'
        replace: "{{ redirect_to }}"

    - name: SSL | Create temporary HTTP-only config for validation
      copy:
        dest: "/etc/nginx/sites-available/{{ target_domain }}"
        content: |
          server {
              listen 80;
              server_name {{ target_domain }} www.{{ target_domain }};
              root /var/www/{{ target_domain }};
          }

    - name: Nginx | Enable temporary site
      file:
        src: "/etc/nginx/sites-available/{{ target_domain }}"
        dest: "/etc/nginx/sites-enabled/{{ target_domain }}"
        state: link

    - name: Nginx | Reload for SSL Challenge
      service:
        name: nginx
        state: reloaded

    - name: SSL | Obtain Certificate via Webroot
      command: >
        certbot certonly --webroot -w /var/www/{{ target_domain }}
        -d {{ target_domain }} -d www.{{ target_domain }}
        --non-interactive --agree-tos --email admin@{{ target_domain }}
      args:
        creates: "/etc/letsencrypt/live/{{ target_domain }}/fullchain.pem"

    - name: Nginx | Download FINAL SSL Vhost Config from GitHub
      get_url:
        url: "{{ nginx_source }}"
        dest: "/etc/nginx/sites-available/{{ target_domain }}"
        force: yes

    - name: Nginx | Customize Vhost with Domain
      replace:
        path: "/etc/nginx/sites-available/{{ target_domain }}"
        regexp: 'TEMPLATE_DOMAIN'
        replace: "{{ target_domain }}"

    - name: Nginx | Final Reload
      service:
        name: nginx
        state: restarted

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded
