<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --border:   rgba(255,255,255,0.07);
      --gold:     #c9a84c;
      --gold-dim: #8a6e30;
      --text:     #e8e4dc;
      --muted:    #6b6860;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* ── Noise grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 100;
    }

    /* ── Ambient glow ── */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .stage {
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      position: relative;
      max-width: 520px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3.5rem 3rem;
      text-align: center;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Corner accents */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--gold-dim);
      border-style: solid;
    }
    .card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fade 0.6s 0.3s ease forwards;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: fade 0.6s 0.4s ease forwards;
    }
    .divider span { flex: 1; height: 1px; background: var(--border); }
    .divider svg  { flex-shrink: 0; }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 6vw, 3rem);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
      opacity: 0;
      animation: fade 0.7s 0.5s ease forwards;
    }

    .sub {
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.05em;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fade 0.7s 0.65s ease forwards;
    }

    .btn-wrap {
      opacity: 0;
      animation: fade 0.7s 0.8s ease forwards;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2rem;
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      transition: color 0.3s, border-color 0.3s;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn:hover { color: var(--bg); border-color: var(--gold); }
    .btn:hover::before { transform: scaleX(1); }

    .btn span, .btn svg { position: relative; z-index: 1; }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      opacity: 0;
      animation: fade 0.6s 1s ease forwards;
    }

    /* ── Keyframes ── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">

      <p class="eyebrow">You have been invited</p>

      <div class="divider">
        <span></span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <rect x="4" y="0" width="2" height="2" fill="#c9a84c"/>
          <rect x="4" y="4" width="2" height="2" fill="#c9a84c"/>
          <rect x="4" y="8" width="2" height="2" fill="#c9a84c"/>
          <rect x="0" y="4" width="2" height="2" fill="#c9a84c"/>
          <rect x="8" y="4" width="2" height="2" fill="#c9a84c"/>
        </svg>
        <span></span>
      </div>

      <h1>Welcome.<br>COMPANY_NAME</h1>

      <p class="sub">
        Click below to proceed to our site.<br>
        You will be redirected securely.
      </p>

      <div class="btn-wrap">
        <a href="DESTINATION_URL" class="btn">
          <span>Redirect to our Site</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <p class="footer-note">Secure redirect &nbsp;·&nbsp; DESTINATION_URL</p>

    </div>
  </div>
</body>
</html>
